[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mortables"
version = "0.1.1"
description = "Tables de mortalité réglementaires françaises et fonctions actuarielles"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "mehdijac" },
]
keywords = [
    "actuarial", "mortality", "life insurance", "annuity",
    "TH0002", "TF0002", "TGH05", "TGF05",
    "actuariat", "mortalité", "assurance vie", "rente viagère",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Mathematics",
]

dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.5"]

[dependency-groups]
dev = [
    "matplotlib>=3.5",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "build>=1.0",
]

[project.urls]
Homepage = "https://github.com/mehdijac/mortables"
Documentation = "https://github.com/mehdijac/mortables#readme"
Repository = "https://github.com/mehdijac/mortables"
Issues = "https://github.com/mehdijac/mortables/issues"

[tool.setuptools.packages.find]
include = ["mortables*"]

[tool.setuptools.package-data]
mortables = ["tables/*/*.csv", "tables/*/*.json"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
